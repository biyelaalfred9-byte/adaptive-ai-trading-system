[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ai-trading-system"
version = "0.2.0"
description = "Safety-first multi-market paper trading foundation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]

[project.scripts]
paper-trader = "trading_system.paper_trading_runner:main"

[project.optional-dependencies]
crypto = ["ccxt>=4.2"]
forex = ["httpx>=0.27"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["ccxt>=4.2", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["trading_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
