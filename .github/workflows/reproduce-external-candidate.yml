name: Reproduce external strategy from public archive data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reproduce-external-candidate.yml"
      - "research/reproduce_reinforced_average.py"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download Binance Vision candles and run independent backtest
        run: python research/reproduce_reinforced_average.py

      - name: Upload actual backtest report and trades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reinforced-average-independent-backtest
          path: |
            research/results/
            research/market-data/
          if-no-files-found: warn
          retention-days: 14
