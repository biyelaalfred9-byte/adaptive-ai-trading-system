name: Scheduled Paper Trading

on:
  push:
    branches: [main]
  schedule:
    # Poll every 15 minutes so missed/delayed hourly triggers are less disruptive.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    # Public-repository standard GitHub-hosted runners are free.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Restore paper-trading SQLite state
        uses: actions/cache@v4
        with:
          path: state/
          key: paper-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            paper-state-v1-

      - name: Install read-only market-data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[crypto]"

      - name: Run one paper-trading cycle
        run: |
          mkdir -p state
          python -m trading_system.paper_trading_runner configs/paper-trading.github-actions.json --once

      - name: Upload run summary
        if: always()
        run: |
          {
            echo "## Scheduled paper-trading run"
            echo "- Mode: paper only; no live orders"
            echo "- Market data: public Binance candles"
            echo "- State: SQLite cache (best-effort persistence)"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
