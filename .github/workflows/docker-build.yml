name: Docker image validation

on:
  push:
    branches: ["main", "master"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "configs/paper-trading.cloud.example.json"
      - "pyproject.toml"
      - "trading_system/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "configs/paper-trading.cloud.example.json"
      - "pyproject.toml"
      - "trading_system/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build paper-trader image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: adaptive-ai-trading-system:paper
