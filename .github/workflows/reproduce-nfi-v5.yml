name: NFI V5 independent reproduction (paper research only)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reproduce-nfi-v5.yml"
      - "research/download_nfi_data.py"
      - "research/verify_nfi_data.py"
      - "research/analyze_nfi_backtest.py"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Freqtrade research environment
        run: |
          mkdir -p user_data/strategies user_data/data/binance user_data/backtest_results/full user_data/backtest_results/oos
          cat > user_data/config.json <<'JSON'
          {
            "max_open_trades": 5,
            "stake_currency": "USDT",
            "stake_amount": 200,
            "tradable_balance_ratio": 0.99,
            "fiat_display_currency": "USD",
            "dry_run": true,
            "dry_run_wallet": 1000,
            "cancel_open_orders_on_exit": false,
            "trading_mode": "spot",
            "margin_mode": "",
            "entry_pricing": {
              "price_side": "same",
              "use_order_book": false,
              "price_last_balance": 0.0
            },
            "exit_pricing": {
              "price_side": "same",
              "use_order_book": false,
              "price_last_balance": 0.0
            },
            "exchange": {
              "name": "binance",
              "key": "",
              "secret": "",
              "ccxt_config": {
                "urls": {"api": {"public": "https://data-api.binance.vision/api/v3"}},
                "options": {"fetchCurrencies": false, "fetchMarkets": {"types": ["spot"]}}
              },
              "ccxt_async_config": {
                "urls": {"api": {"public": "https://data-api.binance.vision/api/v3"}},
                "options": {"fetchCurrencies": false, "fetchMarkets": {"types": ["spot"]}}
              },
              "pair_whitelist": ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT", "ADA/USDT", "DOGE/USDT", "LINK/USDT", "LTC/USDT", "AVAX/USDT", "DOT/USDT", "TRX/USDT"],
              "pair_blacklist": []
            },
            "pairlists": [{"method": "StaticPairList"}],
            "timeframe": "5m",
            "fee": 0.001
          }
          JSON
      - name: Preflight official Binance market-data-only endpoint through CCXT
        run: |
          docker run --rm --entrypoint python -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable research/preflight_nfi_marketdata.py
      - name: Restore Binance Vision archive cache
        uses: actions/cache@v4
        with:
          path: .cache/binance-vision
          key: nfi-binance-vision-2023-2025-v2-12pairs
      - name: Download public 5m and 1h candles (Binance Vision only)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable -lc "python -m pip install --quiet --target /tmp/nfi-deps pandas pyarrow && PYTHONPATH=/tmp/nfi-deps python research/download_nfi_data.py"
      - name: Verify normalized candle coverage
        run: |
          docker run --rm --entrypoint python -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable research/verify_nfi_data.py
      - name: Fetch pinned upstream strategy source into isolated research workspace
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/remiotore/ccxt-freqtrade/4586a4c30611106117494c6518bca1840047f818/strategies/NostalgiaForInfinityV5.py --output user_data/strategies/NostalgiaForInfinityV5.py
          test -s user_data/strategies/NostalgiaForInfinityV5.py
      - name: Run full-history backtest and export machine-readable trades
        run: |
          chmod -R a+rwX user_data
          rm -f user_data/backtest_results/full/*.json
          docker run --rm -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable backtesting --user-data-dir /workspace/user_data --config /workspace/user_data/config.json --strategy-path /workspace/user_data/strategies --strategy NostalgiaForInfinityV5 --datadir /workspace/user_data/data/binance --timeframe 5m --timerange 20230101-20260101 --cache none --export trades --backtest-directory /workspace/user_data/backtest_results/full
          result="$(find user_data/backtest_results/full -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$result" && cp "$result" user_data/nfi-v5-backtest-full.json
          test -s user_data/nfi-v5-backtest-full.json
          python research/analyze_nfi_backtest.py --directory user_data/backtest_results/full --output user_data/reports/nfi-v5-full-trades.json --label full_2023_2025
      - name: Run 2025 holdout period and export machine-readable trades
        run: |
          rm -f user_data/backtest_results/oos/*.json
          docker run --rm -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable backtesting --user-data-dir /workspace/user_data --config /workspace/user_data/config.json --strategy-path /workspace/user_data/strategies --strategy NostalgiaForInfinityV5 --datadir /workspace/user_data/data/binance --timeframe 5m --timerange 20250101-20260101 --cache none --export trades --backtest-directory /workspace/user_data/backtest_results/oos
          result="$(find user_data/backtest_results/oos -maxdepth 1 -type f -name '*.json' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$result" && cp "$result" user_data/nfi-v5-backtest-oos-2025.json
          test -s user_data/nfi-v5-backtest-oos-2025.json
          python research/analyze_nfi_backtest.py --directory user_data/backtest_results/oos --output user_data/reports/nfi-v5-2025-trades.json --label baseline_2025
      - name: Build conservative exposure config (2 positions, $100 each, spot only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("user_data/config.json").read_text())
          config["max_open_trades"] = 2
          config["stake_amount"] = 100
          config["dry_run"] = True
          config["dry_run_wallet"] = 1000
          config["trading_mode"] = "spot"
          Path("user_data/config-strict.json").write_text(json.dumps(config, indent=2))
          PY
      - name: Run conservative full-history backtest and audit individual trades
        run: |
          mkdir -p user_data/backtest_results/strict-full
          rm -f user_data/backtest_results/strict-full/*
          docker run --rm -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable backtesting --user-data-dir /workspace/user_data --config /workspace/user_data/config-strict.json --strategy-path /workspace/user_data/strategies --strategy NostalgiaForInfinityV5 --datadir /workspace/user_data/data/binance --timeframe 5m --timerange 20230101-20260101 --cache none --export trades --backtest-directory /workspace/user_data/backtest_results/strict-full
          python research/analyze_nfi_backtest.py --directory user_data/backtest_results/strict-full --output user_data/reports/nfi-v5-strict-full-trades.json --label strict_full_2023_2025
      - name: Run conservative 2025 holdout and audit individual trades
        run: |
          mkdir -p user_data/backtest_results/strict-2025
          rm -f user_data/backtest_results/strict-2025/*
          docker run --rm -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable backtesting --user-data-dir /workspace/user_data --config /workspace/user_data/config-strict.json --strategy-path /workspace/user_data/strategies --strategy NostalgiaForInfinityV5 --datadir /workspace/user_data/data/binance --timeframe 5m --timerange 20250101-20260101 --cache none --export trades --backtest-directory /workspace/user_data/backtest_results/strict-2025
          python research/analyze_nfi_backtest.py --directory user_data/backtest_results/strict-2025 --output user_data/reports/nfi-v5-strict-2025-trades.json --label strict_2025
      - name: Validate real trade exports and upload reproducible results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reports = [
              Path("user_data/reports/nfi-v5-full-trades.json"),
              Path("user_data/reports/nfi-v5-2025-trades.json"),
              Path("user_data/reports/nfi-v5-strict-full-trades.json"),
              Path("user_data/reports/nfi-v5-strict-2025-trades.json"),
          ]
          for path in reports:
              if not path.exists():
                  raise SystemExit(f"MISSING TRADE AUDIT: {path}")
              data = json.loads(path.read_text())
              if data.get("trade_count", 0) < 1:
                  raise SystemExit(f"NO TRADES EXTRACTED: {path}")
              print(f"VALID TRADE EXPORT: {path}; trades={data['trade_count']}; win_rate={data['win_rate_pct']}%; PF={data['trade_profit_factor']}; net={data['net_profit_abs']}")
          PY
      - name: Upload reproduction data and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfi-v5-twelve-pair-reproduction-v2
          path: |
            user_data/reports/*.json
            user_data/backtest_results/**/*.zip
            user_data/config.json
            user_data/config-strict.json
            user_data/strategies/NostalgiaForInfinityV5.py
          if-no-files-found: warn
          retention-days: 14
