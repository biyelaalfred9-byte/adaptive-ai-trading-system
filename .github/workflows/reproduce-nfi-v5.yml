name: NFI V5 independent reproduction (paper research only)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/reproduce-nfi-v5.yml"
      - "research/download_nfi_data.py"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated Freqtrade research environment
        run: |
          mkdir -p user_data/strategies user_data/data/binance
          cat > user_data/config.json <<'JSON'
          {
            "max_open_trades": 5,
            "stake_currency": "USDT",
            "stake_amount": 200,
            "tradable_balance_ratio": 0.99,
            "fiat_display_currency": "USD",
            "dry_run": true,
            "dry_run_wallet": 1000,
            "cancel_open_orders_on_exit": false,
            "trading_mode": "spot",
            "margin_mode": "",
            "exchange": {
              "name": "binance",
              "key": "",
              "secret": "",
              "ccxt_config": {
                "urls": {"api": {"public": "https://data-api.binance.vision/api/v3"}},
                "options": {"fetchCurrencies": false}
              },
              "ccxt_async_config": {
                "urls": {"api": {"public": "https://data-api.binance.vision/api/v3"}},
                "options": {"fetchCurrencies": false}
              },
              "pair_whitelist": ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT"],
              "pair_blacklist": []
            },
            "pairlists": [{"method": "StaticPairList"}],
            "timeframe": "5m",
            "fee": 0.001
          }
          JSON
      - name: Preflight official Binance market-data-only endpoint through CCXT
        run: |
          docker run --rm freqtradeorg/freqtrade:stable python -c '
          import asyncio
          import ccxt.pro as ccxt
          async def main():
              exchange = ccxt.binance({
                  "enableRateLimit": True,
                  "urls": {"api": {"public": "https://data-api.binance.vision/api/v3"}},
                  "options": {"fetchCurrencies": False},
              })
              try:
                  markets = await exchange.load_markets()
                  required = ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT"]
                  missing = [pair for pair in required if pair not in markets]
                  if missing:
                      raise SystemExit(f"Missing required Binance spot markets: {missing}")
                  for pair in required:
                      market = markets[pair]
                      if not market.get("spot") or market.get("quote") != "USDT":
                          raise SystemExit(f"Unexpected market metadata for {pair}: {market}")
                      print("{}: active={}, precision={}, limits={}".format(pair, market.get("active"), market.get("precision"), market.get("limits")) )
                  print(f"PASS: loaded {len(markets)} markets from official Binance market-data-only endpoint")
              finally:
                  await exchange.close()
          asyncio.run(main())
      - name: Download public 5m and 1h candles (Binance Vision only)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint sh -v "$PWD:/freqtrade" -w /freqtrade freqtradeorg/freqtrade:stable -lc "python -m pip install --quiet --target /tmp/nfi-deps pandas pyarrow && PYTHONPATH=/tmp/nfi-deps python research/download_nfi_data.py"
      - name: Fetch pinned upstream strategy source into isolated research workspace
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/remiotore/ccxt-freqtrade/4586a4c30611106117494c6518bca1840047f818/strategies/NostalgiaForInfinityV5.py --output user_data/strategies/NostalgiaForInfinityV5.py
          test -s user_data/strategies/NostalgiaForInfinityV5.py
      - name: Run Freqtrade backtest (original strategy settings, no live trading)
        run: |
          # Do not mount over /freqtrade: that is where the official image installs
          # the Freqtrade Python package. Mount the research workspace elsewhere.
          chmod -R a+rwX user_data
          docker run --rm -v "$PWD:/workspace" -w /workspace freqtradeorg/freqtrade:stable backtesting --config user_data/config.json --strategy NostalgiaForInfinityV5 --datadir user_data/data/binance --timeframe 5m --timerange 20230101-20260101 --export trades --export-filename user_data/nfi-v5-backtest.json
      - name: Upload reproduction data and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfi-v5-four-pair-reproduction
          path: |
            user_data/nfi-v5-backtest.json
            user_data/config.json
            user_data/strategies/NostalgiaForInfinityV5.py
          if-no-files-found: warn
          retention-days: 14
